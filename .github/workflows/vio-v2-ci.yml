name: Vio-Studio v2 development CI

on:
  push:
    branches:
      - develop/vio-studio-v2
    paths:
      - "v2/**"
      - ".github/workflows/vio-v2-ci.yml"
  pull_request:
    branches:
      - develop/vio-studio-v2
    paths:
      - "v2/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vio-v2-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout development source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Supabase Edge Function
        working-directory: v2
        run: deno check --no-lock supabase/functions/vio-api/index.ts
      - name: Set up Python for PostgreSQL migration validation
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate PostgreSQL migration syntax
        working-directory: v2
        run: |
          python -m pip install --disable-pip-version-check pglast
          python tests/check_migrations.py
      - name: Check JavaScript syntax and run regression tests
        working-directory: v2
        run: |
          set -euo pipefail
          node --check src/app.js
          node --check src/avatar-renderer.js
          node --check src/audio-engine.js
          node --check src/overlay.js
          node --test tests/*.test.mjs
