name: Vio-Studio v2 development CI

on:
  push:
    branches:
      - develop/vio-studio-v2
    paths:
      - "v2/**"
      - ".github/workflows/vio-v2-ci.yml"
  pull_request:
    branches:
      - develop/vio-studio-v2
    paths:
      - "v2/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vio-v2-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vio_cleanup_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vio_cleanup_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout development source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Supabase Edge Function
        working-directory: v2
        run: deno check --node-modules-dir=auto --no-lock supabase/functions/vio-api/index.ts
      - name: Set up Python for PostgreSQL migration validation
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate PostgreSQL migration syntax
        working-directory: v2
        run: |
          python -m pip install --disable-pip-version-check pglast psycopg[binary]
          python tests/check_migrations.py
      - name: Test Storage cleanup concurrency on isolated PostgreSQL
        working-directory: v2
        env:
          VIO_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vio_cleanup_test
        run: python tests/storage-cleanup-concurrency.py
      - name: Install browser test dependencies
        working-directory: v2
        run: npm install --no-audit --no-fund
      - name: Install Chromium for renderer visual tests
        working-directory: v2
        run: npx playwright install chromium
      - name: Run browser renderer visual smoke test
        working-directory: v2
        run: node tests/browser-renderer.visual.mjs
      - name: Check JavaScript syntax and run regression tests
        working-directory: v2
        run: |
          set -euo pipefail
          node --check src/app.js
          node --check src/avatar-renderer.js
          node --check src/audio-engine.js
          node --check src/overlay.js
          node --check tests/browser-renderer.visual.mjs
          node --check tests/browser-renderer.performance.mjs
          node --test tests/*.test.mjs
