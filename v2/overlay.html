<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Vio Studio · OBS Overlay</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent!important}
    canvas{display:block;width:100%;height:100%;object-fit:contain;background:transparent}
    .status{display:none;position:fixed;left:12px;right:12px;top:12px;max-width:560px;padding:12px 14px;border:1px solid #9ce0c955;border-radius:12px;background:rgba(16,24,31,.92);backdrop-filter:blur(12px);color:#d9f8ec;font:12px/1.5 system-ui;pointer-events:none;box-shadow:0 8px 30px #0007;z-index:10}
    .status.is-visible,.debug .status{display:block}
    .status.is-error{border-color:#ff8f9c99;background:rgba(44,20,27,.94);color:#ffd0d6}
  </style>
  <script>
    if(new URLSearchParams(location.search).get("debug")==="1")document.documentElement.classList.add("debug");
  </script>
</head>
<body>
  <canvas id="stage" width="1080" height="1920"></canvas>
  <div id="status" class="status" role="status" aria-live="polite">Connecting to Vio Studio…</div>
  <script type="module" src="./src/overlay.js"></script>
</body>
</html>
